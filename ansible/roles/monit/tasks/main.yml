# Monit now comes from the OS's own repositories, so remove the Buster backports repo
# that older versions of monmon added (the monmon role does this too, but the monit role
# can also be run on its own)
- name: 'Remove the old Buster backports repo'
  file:
    path: /etc/apt/sources.list.d/buster-backports.list
    state: absent

- name: 'Update repos'
  apt:
    update_cache: yes
    force_apt_get: true
    cache_valid_time: 3600

- name: 'Upgrade packages'
  apt:
    upgrade: dist
    force_apt_get: yes

- name: 'Install Monit'
  apt:
    name:
    - monit
    state: present

- name: 'Check to see if the custom monit config file exists'
  stat:
    path: 'monit.custom.j2'
    follow: yes
  delegate_to: localhost
  register: custom_monit_config_file

- name: 'Copy custom monit config file to /etc/monit/monitrc'
  template:
    src: 'monit.custom.j2'
    dest: '/etc/monit/monitrc'
    owner: 'root'
    group: 'root'
    mode: '0600'
  when: custom_monit_config_file.stat.exists

- name: "Copy default monit.j2 file to /etc/monit"
  template:
    src: 'monit.j2'
    dest: '/etc/monit/monitrc'
    owner: 'root'
    group: 'root'
    mode: '0600'
  when: not custom_monit_config_file.stat.exists

- name: 'Enable Monit'
  service:
    name: monit
    enabled: yes

# Runs after the monmon role, which removes the old Buster backports repo, updates the
# repos, and upgrades the packages first
- name: 'Install Monit'
  apt:
    name:
    - monit
    state: present

- name: 'Check to see if the custom monit config file exists'
  stat:
    path: 'monit.custom.j2'
    follow: yes
  delegate_to: localhost
  # Only checks a file on the local system, which needs no sudo there
  become: false
  register: custom_monit_config_file

- name: 'Copy custom monit config file to /etc/monit/monitrc'
  template:
    src: 'monit.custom.j2'
    dest: '/etc/monit/monitrc'
    owner: 'root'
    group: 'root'
    mode: '0600'
  when: custom_monit_config_file.stat.exists

- name: "Copy default monit.j2 file to /etc/monit"
  template:
    src: 'monit.j2'
    dest: '/etc/monit/monitrc'
    owner: 'root'
    group: 'root'
    mode: '0600'
  when: not custom_monit_config_file.stat.exists

- name: 'Enable Monit'
  service:
    name: monit
    enabled: yes

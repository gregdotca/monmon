##############################################################################
# COMMON
##############################################################################

# Older versions of monmon added a Buster backports repo for Monit, which is no longer
# needed and breaks apt on newer releases, so remove it before updating the repos
- name: 'Remove the old Buster backports repo'
  file:
    path: /etc/apt/sources.list.d/buster-backports.list
    state: absent

- name: 'Update repos'
  apt:
    update_cache: yes
    force_apt_get: true
    cache_valid_time: 3600

- name: 'Upgrade packages'
  apt:
    upgrade: dist
    force_apt_get: yes

- name: 'Install software packages via apt (common)'
  apt:
    name: ['curl', 'git', 'nginx', 'php-curl', 'php-fpm', 'php-xml', 'python3-numpy', 'python3-pil', 'python3-requests', 'python3-rpi.gpio', 'python3-spidev', 'python3-xmltodict', 'ttf-wqy-zenhei']
    force_apt_get: 'yes'

- name: 'Copy nginx config file'
  template:
    src: 'nginx.http.conf.j2'
    dest: '/etc/nginx/sites-available/default'
    owner: 'root'
    group: 'root'
    mode: '0644'
  notify: restart nginx

# raspi-config prints 0 when SPI is already enabled
- name: 'Check whether SPI kernel support is enabled'
  command: 'raspi-config nonint get_spi'
  register: spi_status
  changed_when: false

- name: 'Enable SPI kernel support'
  command: 'raspi-config nonint do_spi 0' # Enable SPI interface (for certain display hats)
  when: spi_status.stdout | trim != '0'

- name: "Create /var/www/html dir"
  file:
    path: '/var/www/html'
    state: directory
    owner: 'root'
    group: 'root'
    mode: 0755

- name: 'Delete default index.html'
  file:
    path: '/var/www/html/index.html'
    state: absent

- name: 'Delete default 502.html'
  file:
    path: '/var/www/html/502.html'
    state: absent

- name: 'Delete default index.nginx-debian.html'
  file:
    path: '/var/www/html/index.nginx-debian.html'
    state: absent

- name: "Checkout the monmon git repo"
  git:
    repo: 'https://github.com/gregdotca/monmon.git'
    dest: '/var/www/html'
    umask: '022'
    force: yes

- name: 'Change ownership of all files in /var/www/html'
  file:
    path: '/var/www/html'
    state: directory
    recurse: yes
    owner: 'root'
    group: 'root'

- name: 'Check to see if the custom config file exists'
  stat:
    path: 'config.custom.j2'
    follow: yes
  delegate_to: localhost
  # Only checks a file on the local system, which needs no sudo there
  become: false
  register: custom_config_file

- name: 'Copy custom config file to /var/www/html'
  template:
    src: 'config.custom.j2'
    dest: '/var/www/html/config.custom'
    owner: 'root'
    group: 'root'
    mode: '0644'
  when: custom_config_file.stat.exists

- name: "Copy default config.j2 config file to /var/www/html"
  template:
    src: 'config.j2'
    dest: '/var/www/html/config'
    owner: 'root'
    group: 'root'
    mode: '0644'
  when: not custom_config_file.stat.exists

# An earlier install may have left one, which would still be used
- name: 'Remove any old custom config file'
  file:
    path: '/var/www/html/config.custom'
    state: absent
  when: not custom_config_file.stat.exists

- name: 'Check to see if the custom alert_off include file exists'
  stat:
    path: 'include.alert_off.custom.j2'
    follow: yes
  delegate_to: localhost
  # Only checks a file on the local system, which needs no sudo there
  become: false
  register: custom_include_alert_off_file

- name: 'Copy custom include alert_off file to /var/www/html'
  template:
    src: 'include.alert_off.custom.j2'
    dest: '/var/www/html/include.alert_off'
    owner: 'root'
    group: 'root'
    mode: '0644'
  when: custom_include_alert_off_file.stat.exists

# An earlier install may have left one, which would still be used
- name: 'Remove any old custom include alert_off file'
  file:
    path: '/var/www/html/include.alert_off'
    state: absent
  when: not custom_include_alert_off_file.stat.exists

- name: 'Check to see if the custom alert_on include file exists'
  stat:
    path: 'include.alert_on.custom.j2'
    follow: yes
  delegate_to: localhost
  # Only checks a file on the local system, which needs no sudo there
  become: false
  register: custom_include_alert_on_file

- name: 'Copy custom include alert_on file to /var/www/html'
  template:
    src: 'include.alert_on.custom.j2'
    dest: '/var/www/html/include.alert_on'
    owner: 'root'
    group: 'root'
    mode: '0644'
  when: custom_include_alert_on_file.stat.exists

# An earlier install may have left one, which would still be used
- name: 'Remove any old custom include alert_on file'
  file:
    path: '/var/www/html/include.alert_on'
    state: absent
  when: not custom_include_alert_on_file.stat.exists

- name: 'Check to see if the custom nodes file exists'
  stat:
    path: 'nodes.custom.j2'
    follow: yes
  delegate_to: localhost
  # Only checks a file on the local system, which needs no sudo there
  become: false
  register: custom_nodes_file

- name: 'Copy custom nodes file to /var/www/html'
  template:
    src: 'nodes.custom.j2'
    dest: '/var/www/html/nodes.custom'
    owner: 'root'
    group: 'root'
    mode: '0644'
  when: custom_nodes_file.stat.exists

- name: "Copy default nodes.j2 config file to /var/www/html"
  template:
    src: 'nodes.j2'
    dest: '/var/www/html/nodes'
    owner: 'root'
    group: 'root'
    mode: '0644'
  when: not custom_nodes_file.stat.exists

# An earlier install may have left one, which would still be used
- name: 'Remove any old custom nodes file'
  file:
    path: '/var/www/html/nodes.custom'
    state: absent
  when: not custom_nodes_file.stat.exists

# Older versions of monmon built the BCM 2835 and WiringPi C libraries here, which nothing
# uses, so remove the source and build files an earlier install left behind
- name: 'Remove the old BCM 2835 and WiringPi library folders'
  file:
    path: '{{ item }}'
    state: absent
  with_items:
    - '/var/www/html/BCM2835'
    - '/var/www/html/WiringPi'

# The libraries themselves, whose file names include the WiringPi version
- name: 'Find the old BCM 2835 and WiringPi libraries'
  find:
    paths: '/usr/local/lib'
    patterns: ['libbcm2835.a', 'libwiringPi.*', 'libwiringPiDev.*']
    file_type: any
  register: old_gpio_libraries

- name: 'Remove the old BCM 2835 and WiringPi libraries'
  file:
    path: '{{ item.path }}'
    state: absent
  with_items: '{{ old_gpio_libraries.files }}'
  notify: run ldconfig

# Everything else the old builds installed: the BCM 2835 and WiringPi headers, WiringPi's
# setuid gpio tool and its man page, and the links WiringPi made in /usr/lib (which its own
# uninstall leaves behind)
- name: 'Remove the old BCM 2835 and WiringPi files'
  file:
    path: '{{ item }}'
    state: absent
  with_items:
    - '/usr/local/include/bcm2835.h'
    - '/usr/local/include/ads1115.h'
    - '/usr/local/include/bmp180.h'
    - '/usr/local/include/drcNet.h'
    - '/usr/local/include/drcSerial.h'
    - '/usr/local/include/ds18b20.h'
    - '/usr/local/include/htu21d.h'
    - '/usr/local/include/max31855.h'
    - '/usr/local/include/max5322.h'
    - '/usr/local/include/mcp23008.h'
    - '/usr/local/include/mcp23016.h'
    - '/usr/local/include/mcp23016reg.h'
    - '/usr/local/include/mcp23017.h'
    - '/usr/local/include/mcp23s08.h'
    - '/usr/local/include/mcp23s17.h'
    - '/usr/local/include/mcp23x0817.h'
    - '/usr/local/include/mcp23x08.h'
    - '/usr/local/include/mcp3002.h'
    - '/usr/local/include/mcp3004.h'
    - '/usr/local/include/mcp3422.h'
    - '/usr/local/include/mcp4802.h'
    - '/usr/local/include/pcf8574.h'
    - '/usr/local/include/pcf8591.h'
    - '/usr/local/include/pseudoPins.h'
    - '/usr/local/include/rht03.h'
    - '/usr/local/include/sn3218.h'
    - '/usr/local/include/softPwm.h'
    - '/usr/local/include/softServo.h'
    - '/usr/local/include/softTone.h'
    - '/usr/local/include/sr595.h'
    - '/usr/local/include/wiringPi.h'
    - '/usr/local/include/wiringPiI2C.h'
    - '/usr/local/include/wiringPiSPI.h'
    - '/usr/local/include/wiringSerial.h'
    - '/usr/local/include/wiringShift.h'
    - '/usr/local/include/wpiExtensions.h'
    - '/usr/local/include/ds1302.h'
    - '/usr/local/include/gertboard.h'
    - '/usr/local/include/lcd128x64.h'
    - '/usr/local/include/lcd.h'
    - '/usr/local/include/maxdetect.h'
    - '/usr/local/include/piFace.h'
    - '/usr/local/include/piGlow.h'
    - '/usr/local/include/piNes.h'
    - '/usr/local/include/scrollPhat.h'
    - '/usr/local/bin/gpio'
    - '/usr/local/share/man/man1/gpio.1'
    - '/usr/lib/libwiringPi.so'
    - '/usr/lib/libwiringPiDev.so'
  notify: run ldconfig

- name: 'Copy check.py systemd service unit file to /etc/systemd/system'
  template:
    src: 'check.service.j2'
    dest: '/etc/systemd/system/check.service'
    owner: 'root'
    group: 'root'
    mode: '0644'

- name: 'Copy the check.py boot delay systemd service unit file to /etc/systemd/system'
  template:
    src: 'check-boot-delay.service.j2'
    dest: '/etc/systemd/system/check-boot-delay.service'
    owner: 'root'
    group: 'root'
    mode: '0644'

- name: 'Copy check.py systemd timer unit file to /etc/systemd/system'
  template:
    src: 'check.timer.j2'
    dest: '/etc/systemd/system/check.timer'
    owner: 'root'
    group: 'root'
    mode: '0644'

- name: 'Copy alert.py systemd service unit file to /etc/systemd/system'
  template:
    src: 'alert.service.j2'
    dest: '/etc/systemd/system/alert.service'
    owner: 'root'
    group: 'root'
    mode: '0644'

- name: 'Copy alert.py systemd timer unit file to /etc/systemd/system'
  template:
    src: 'alert.timer.j2'
    dest: '/etc/systemd/system/alert.timer'
    owner: 'root'
    group: 'root'
    mode: '0644'

- name: 'Copy the monmon tmpfiles config to /etc/tmpfiles.d'
  template:
    src: 'tmpfiles.conf.j2'
    dest: '/etc/tmpfiles.d/monmon.conf'
    owner: 'root'
    group: 'root'
    mode: '0644'

- name: 'Copy the CPU performance systemd service unit file to /etc/systemd/system'
  template:
    src: 'cpu-performance.service.j2'
    dest: '/etc/systemd/system/cpu-performance.service'
    owner: 'root'
    group: 'root'
    mode: '0644'

- name: 'Reload systemd daemon'
  systemd:
    daemon_reload: yes

- name: 'Enable the check.py systemd timer'
  systemd:
    name: check.timer
    enabled: yes

- name: 'Enable the alert.py systemd timer'
  systemd:
    name: alert.timer
    enabled: yes

# Takes effect at the reboot that ends the install
- name: 'Enable the CPU performance systemd service'
  systemd:
    name: cpu-performance.service
    enabled: yes

# monmon is always plugged in, so Wi-Fi power saving only gets in the way: it delays or
# drops incoming connections. Takes effect at the reboot that ends the install, as
# restarting NetworkManager now could cut off Ansible's own connection
- name: 'Create /etc/NetworkManager/conf.d dir'
  file:
    path: '/etc/NetworkManager/conf.d'
    state: directory
    owner: 'root'
    group: 'root'
    mode: '0755'

- name: 'Copy the NetworkManager config file that turns off Wi-Fi power saving'
  template:
    src: 'wifi-powersave.conf.j2'
    dest: '/etc/NetworkManager/conf.d/monmon-wifi-powersave.conf'
    owner: 'root'
    group: 'root'
    mode: '0644'

- name: 'Copy motd file'
  template:
    src: 'motd.j2'
    dest: '/etc/motd'
    owner: 'root'
    group: 'root'
    mode: '0644'

- hosts: servers
  become: true
  become_method: sudo
  vars_prompt:
    - name: new_pi_password
      prompt: 'New password for the same user (leave blank to keep the current one)'
      private: true
      confirm: true
      unsafe: true
      default: ''
  pre_tasks:
    # 5000 rounds is the Linux default. Ansible's own default is 656000, which makes every
    # login and sudo on a Pi Zero take minutes while it checks the password.
    - name: 'Hash the new user password'
      set_fact:
        new_pi_password_hash: "{{ new_pi_password | password_hash('sha512', rounds=5000) }}"
      no_log: true
      when: new_pi_password | length > 0
  roles:
    - role: monmon
    - role: monit

# Runs last, so the earlier play can still connect and use sudo with the current password
- hosts: servers
  become: true
  become_method: sudo
  gather_facts: false
  roles:
    - role: cleanup
